# One-shot import for the ctc-bench reviewer benchmark. Triggered only by the push that adds
# .bench-import/corpus.bundle.b64 to main. Unpacks the bundle and pushes main + task/* branches with
# this repo's GITHUB_TOKEN. It opens no pull requests. Safe to delete after it has run once.
name: bench-import
on:
  push:
    branches: [main]
    paths: [".bench-import/corpus.bundle.b64"]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack bundle and push main + task branches
        run: |
          set -euo pipefail
          git config user.name "ctc-bench"
          git config user.email "ctc-bench@users.noreply.github.com"
          base64 -d .bench-import/corpus.bundle.b64 > "$RUNNER_TEMP/corpus.bundle"
          git bundle verify "$RUNNER_TEMP/corpus.bundle"
          git fetch -q "$RUNNER_TEMP/corpus.bundle" 'refs/heads/*:refs/remotes/bundle/*'
          # main: the bundle's tree, minus the import payload. The workflow file itself is kept
          # (GITHUB_TOKEN may not change workflow files); it is removed afterwards through the API.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          git checkout bundle/main -- .
          git add -A
          git commit -q -m "Import projects"
          git push -q origin HEAD:main
          for ref in $(git for-each-ref --format='%(refname:strip=3)' 'refs/remotes/bundle/task/'); do
            branch="${ref}"
            git checkout -q -B "$branch" main
            for file in $(git diff --name-only bundle/main "bundle/$branch"); do
              git checkout "bundle/$branch" -- "$file"
            done
            git add -A
            git commit -q -m "$(git log -1 --format=%s "bundle/$branch")"
          done
          git push -q origin 'refs/heads/task/*:refs/heads/task/*'
          git checkout -q main
          echo "pushed $(git for-each-ref 'refs/heads/task/' | wc -l) task branches"
          for b in $(git for-each-ref --format='%(refname:short)' 'refs/heads/task/'); do
            test "$(git rev-parse "$b^{tree}")" != "" || exit 1
            git diff --quiet "bundle/$b" "$b" -- . ':!.github' || { echo "tree mismatch on $b"; exit 1; }
          done
          echo "all branch trees match the bundle (excluding .github)"
